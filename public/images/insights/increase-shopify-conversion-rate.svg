<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Manrope, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="560" rx="28" fill="#F4F1EA"/>
  <text x="60" y="80" font-size="34" font-weight="800" fill="#171918">Where Shopify shoppers drop off</text>
  <text x="60" y="118" font-size="20" fill="#5B5F63">Each step on the path to an order, and what to fix there</text>
  <g font-size="20" fill="#171918">
    <rect x="60" y="160" width="1080" height="72" rx="14" fill="#fff" stroke="#E3DED3"/>
    <text x="84" y="204" font-weight="700">Product page</text><text x="400" y="204" fill="#5B5F63">Photos, clear details, price, reviews, size guide</text>
    <rect x="140" y="250" width="920" height="72" rx="14" fill="#fff" stroke="#E3DED3"/>
    <text x="164" y="294" font-weight="700">Cart</text><text x="400" y="294" fill="#5B5F63">Shipping costs and delivery times shown early</text>
    <rect x="220" y="340" width="760" height="72" rx="14" fill="#fff" stroke="#E3DED3"/>
    <text x="244" y="384" font-weight="700">Checkout</text><text x="400" y="384" fill="#5B5F63">Shop Pay, express and guest checkout</text>
    <rect x="300" y="430" width="600" height="72" rx="14" fill="#171918"/>
    <text x="600" y="474" font-weight="700" fill="#F66135" text-anchor="middle">Order</text>
  </g>
</svg>
