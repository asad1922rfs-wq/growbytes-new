<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Manrope, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="560" rx="28" fill="#F4F1EA"/>
  <text x="60" y="80" font-size="34" font-weight="800" fill="#171918">Where a Shopify budget goes</text>
  <text x="60" y="118" font-size="20" fill="#5B5F63">Monthly running costs and one-time setup costs</text>
  <g font-size="20" fill="#171918">
    <text x="60" y="180" font-weight="700" fill="#D2461F">Every month</text>
    <rect x="60" y="200" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="84" y="239">Shopify plan</text>
    <rect x="60" y="276" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="84" y="315">Payment processing fees</text>
    <rect x="60" y="352" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="84" y="391">Apps</text>
    <rect x="60" y="428" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="84" y="467">Email, domain and small changes</text>
    <text x="640" y="180" font-weight="700" fill="#D2461F">Once, at the start</text>
    <rect x="640" y="200" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="664" y="239">Theme: free, paid or custom</text>
    <rect x="640" y="276" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="664" y="315">Design and store setup</text>
    <rect x="640" y="352" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="664" y="391">Product and content upload</text>
    <rect x="640" y="428" width="500" height="62" rx="14" fill="#fff" stroke="#E3DED3"/><text x="664" y="467">Migration and integrations</text>
  </g>
</svg>
