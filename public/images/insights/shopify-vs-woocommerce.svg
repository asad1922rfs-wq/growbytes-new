<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Manrope, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="540" rx="28" fill="#F4F1EA"/>
  <text x="60" y="80" font-size="34" font-weight="800" fill="#171918">Shopify vs WooCommerce at a glance</text>
  <g font-size="20" fill="#171918">
    <text x="400" y="148" font-weight="800" font-size="24">Shopify</text>
    <text x="780" y="148" font-weight="800" font-size="24">WooCommerce</text>
    <line x1="60" x2="1140" y1="170" y2="170" stroke="#E3DED3"/>
    <text x="60" y="212" fill="#5B5F63">Hosting</text><text x="400" y="212">Included</text><text x="780" y="212">You arrange it</text>
    <line x1="60" x2="1140" y1="236" y2="236" stroke="#E3DED3"/>
    <text x="60" y="278" fill="#5B5F63">Software cost</text><text x="400" y="278">Monthly plan</text><text x="780" y="278">Free plugin, paid extensions</text>
    <line x1="60" x2="1140" y1="302" y2="302" stroke="#E3DED3"/>
    <text x="60" y="344" fill="#5B5F63">Updates and security</text><text x="400" y="344">Handled by Shopify</text><text x="780" y="344">Your responsibility</text>
    <line x1="60" x2="1140" y1="368" y2="368" stroke="#E3DED3"/>
    <text x="60" y="410" fill="#5B5F63">Flexibility</text><text x="400" y="410">High, within Shopify</text><text x="780" y="410">Very high, full code access</text>
    <line x1="60" x2="1140" y1="434" y2="434" stroke="#E3DED3"/>
    <text x="60" y="476" fill="#5B5F63">Best for</text><text x="400" y="476">Selling with less upkeep</text><text x="780" y="476">WordPress sites, deep control</text>
  </g>
</svg>
